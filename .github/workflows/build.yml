name: Build Astra Browser

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Generate Gradle wrapper jar (first run bootstrap)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate ad/tracker blocklist (EasyList + EasyPrivacy + Peter Lowe)
        run: |
          mkdir -p app/src/main/assets
          OUT=app/src/main/assets/blocklist_hosts.txt
          TMP=$(mktemp)
          # Keep the bundled starter list as a floor in case a download fails.
          cp "$OUT" "$TMP" 2>/dev/null || true
          fetch() { curl -fsSL --retry 3 --max-time 60 "$1" || true; }

          # Peter Lowe's list: already plain hostnames.
          fetch "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=nohtml&showintro=0&mimetype=plaintext" >> "$TMP"

          # EasyList / EasyPrivacy: extract only pure-domain rules of the form ||example.com^
          for u in \
            "https://easylist.to/easylist/easylist.txt" \
            "https://easylist.to/easylist/easyprivacy.txt"; do
            fetch "$u" | grep -E '^\|\|[a-z0-9.-]+\^(\$third-party)?$' \
              | sed -E 's/^\|\|//; s/\^.*$//' >> "$TMP"
          done

          # Normalise, drop comments/junk, dedupe.
          tr 'A-Z' 'a-z' < "$TMP" | sed 's/\r//' \
            | grep -E '^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}$' | sort -u > "$OUT"

          # Safety: never block hosts the browser itself depends on.
          grep -vE '^(google\.com|gstatic\.com|googleapis\.com|youtube\.com|ytimg\.com|googlevideo\.com|github\.com|githubusercontent\.com|cloudflare\.com|jsdelivr\.net|cdnjs\.cloudflare\.com)$' "$OUT" > "$OUT.tmp" && mv "$OUT.tmp" "$OUT"
          echo "Blocklist entries: $(wc -l < "$OUT")"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-browser-debug
          path: app/build/outputs/apk/debug/*.apk

      # Release build only runs when a version tag (v1.0.0 etc.) is pushed
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: astra-browser-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
